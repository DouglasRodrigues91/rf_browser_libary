name: Run WEB Tests
run-name: On Push - web Tests Run
on: [push]

jobs:
  web-test:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: install Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -U -r requirements.txt
          sudo npm install @playwright/test
          sudo npx playwright install-deps
          rfbrowser init

      - name: Run RF WEB Tests
        run: |
          robot -d ./results -v HEADLESS:True -v BROWSER:chromium tests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-Chromium
          path: ./results
          if-no-files-found: ignore
          retention-days: 2

      - name: Download Test Results
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: results-Chromium

      - name: Send Report
        if: always()
        uses: joonvena/robotframework-report-action@v2.5
        with:
          report_path: results-Chromium
          gh_acess_token: ${{ secrets.GITHUB_TOKEN }}
          show_passed_tests: false